name: Release

# The release pipeline for master: one run builds and pushes the application image and
# publishes the Android APK.
#
# This file replaces two workflows that each published half of the release
# (Release.yml, which built on Windows and deployed over FTP, and docker-publish.yml):
#
#   - The FTP/IIS deployment is gone, together with the deployment host it targeted.
#     The image is what runs now.
#   - The Windows `dotnet publish` is gone with it. The image's API stage performs that
#     publish for linux-x64, so building it twice would only produce an artefact nothing
#     consumes.
#   - The SBOM, the image digest and the mobile build are kept: they are the parts of a
#     release that are still needed, and they now live in one run.
#
# workflow_dispatch exists so a release can be built from a BRANCH without merging. It
# publishes a ref-scoped image tag and deliberately does NOT move `latest`.

permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Application image: build, push, attest ─────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: docker-buildx-${{ runner.os }}-${{ hashFiles('Dockerfile', 'docker/**') }}
          restore-keys: |
            docker-buildx-${{ runner.os }}-

      - name: Login to Gitea container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.GITEA_REGISTRY || 'gitea.fpssoftware.uk' }}
          username: ${{ secrets.GITEA_REGISTRY_USERNAME }}
          password: ${{ secrets.GITEA_REGISTRY_TOKEN }}

      # The `latest` tag is what the cluster's image updater watches. Only a push to
      # master may move it.
      #
      # A manual run from a branch publishes a ref-scoped tag instead, deliberately: a
      # branch build must be able to produce an image and a digest WITHOUT becoming the
      # image anything deploys.
      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          REGISTRY="${{ secrets.GITEA_REGISTRY || 'gitea.fpssoftware.uk' }}"
          OWNER="${{ secrets.GITEA_REGISTRY_OWNER || 'fps-software' }}"
          IMAGE="${REGISTRY}/${OWNER}/econoflow"

          # The commit SHA tag is always published: it is the immutable handle a
          # deployment should pin, and the one whose digest gets recorded.
          TAGS="${IMAGE}:${{ github.sha }}"

          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
            echo "Release build on master: publishing :${{ github.sha }} and :latest"
          else
            SAFE_REF="$(echo '${{ github.ref_name }}' | tr '/' '-')"
            TAGS="${TAGS}"$'\n'"${IMAGE}:${SAFE_REF}"
            echo "Manual build from '${SAFE_REF}': publishing :${{ github.sha }} and :${SAFE_REF}, NOT latest"
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            GITEA_NUGET_USERNAME=${{ secrets.GITEA_NUGET_USERNAME }}
            GITEA_NUGET_TOKEN=${{ secrets.GITEA_NUGET_TOKEN }}
          cache-from: |
            type=gha
            type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache,mode=max
          tags: ${{ steps.tags.outputs.tags }}
          # CRA: the image must carry a component inventory and a provenance attestation.
          # BuildKit attaches both as attestation manifests on the pushed digest, so a
          # deployed image can be resolved back to its components and its source commit.
          sbom: true
          provenance: mode=max

      # The BuildKit attestation is only reachable through the registry. This copy is a
      # standalone CycloneDX SBOM kept with the release artefacts so that triage does not
      # need registry access or the buildx cache - it is what answers "is this CVE
      # affecting our product?" inside the CRA Article 14 window.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX --version 6.3.1

      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs --output sbom
        env:
          GITEA_NUGET_USERNAME: ${{ secrets.GITEA_NUGET_USERNAME }}
          GITEA_NUGET_TOKEN: ${{ secrets.GITEA_NUGET_TOKEN }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom/**/*.cdx.json
          retention-days: 90

      # A digest-pinned Deployment does NOT follow a tag, and re-resolving it by hand is
      # where time is lost. Print it in the run summary so it is recorded with the release.
      - name: Record the image digest
        run: |
          set -euo pipefail
          REGISTRY="${{ secrets.GITEA_REGISTRY || 'gitea.fpssoftware.uk' }}"
          OWNER="${{ secrets.GITEA_REGISTRY_OWNER || 'fps-software' }}"
          IMAGE="${REGISTRY}/${OWNER}/econoflow"

          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${{ github.sha }}" \
            --format '{{.Manifest.Digest}}')"

          {
            echo "## Image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| ref | \`${{ github.ref }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| **digest** | \`${DIGEST}\` |"
            echo "| pin as | \`${IMAGE}@${DIGEST}\` |"
            echo ""
            if [ "${{ github.ref }}" != "refs/heads/master" ]; then
              echo "> Built from a branch: \`latest\` was **not** moved."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "::notice title=Image digest::${IMAGE}@${DIGEST}"

      # Publish the BOM to Dependency-Track so new CVEs are matched against what we ship.
      # Master only: a branch build must not create or overwrite project versions in
      # the portfolio.
      - name: Publish SBOM to Dependency-Track
        if: github.ref == 'refs/heads/master'
        env:
          DTRACK_URL: https://dtrack.fpssoftware.uk
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: |
          set -euo pipefail

          BOM="sbom/econoflow.cdx.json"
          test -s "$BOM" || { echo "::error::$BOM is missing or empty"; exit 1; }

          # Show what is being uploaded, and refuse to replace the project's
          # components with an empty BOM.
          COUNT="$(jq '.components | length' "$BOM")"
          echo "Components in $BOM: ${COUNT}"
          jq -r '[.components[]?.purl // empty | capture("^pkg:(?<t>[^/]+)/").t]
                 | group_by(.) | map("  \(.[0]): \(length)") | .[]' "$BOM"
          [ "$COUNT" -gt 0 ] || { echo "::error::BOM has no components"; exit 1; }

          # The BOM travels as a base64 string inside the JSON body. The payload is built
          # in a file because it is too large to pass as a command-line argument.
          base64 -w0 "$BOM" > bom.b64
          jq -n \
            --arg name "EconoFlow" \
            --arg version "production" \
            --rawfile bom bom.b64 \
            '{projectName: $name, projectVersion: $version, autoCreate: true, isLatest: true, bom: $bom}' \
            > payload.json

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X PUT "${DTRACK_URL}/api/v1/bom" \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @payload.json
          echo

  # ── Mobile: standalone APK ─────────────────────────────────────────────────
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7

    - name: Detect mobile changes
      id: mobile-changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          mobile:
            - 'econoflow-mobile/**'

    - name: Install Node.js
      if: steps.mobile-changes.outputs.mobile == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'

    - name: Setup Java 17
      if: steps.mobile-changes.outputs.mobile == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache mobile node_modules
      if: steps.mobile-changes.outputs.mobile == 'true'
      uses: actions/cache@v6
      with:
        path: ./econoflow-mobile/node_modules
        key: mobile-node-modules-${{ runner.os }}-${{ hashFiles('./econoflow-mobile/package-lock.json') }}

    - name: Install mobile dependencies
      if: steps.mobile-changes.outputs.mobile == 'true'
      run: npm ci
      working-directory: ./econoflow-mobile

    - name: Generate Android native project
      if: steps.mobile-changes.outputs.mobile == 'true'
      run: npx expo prebuild --platform android --no-install --clean
      working-directory: ./econoflow-mobile

    - name: Cache Gradle
      if: steps.mobile-changes.outputs.mobile == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('econoflow-mobile/android/**/*.gradle*', 'econoflow-mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Generate signing keystore
      if: steps.mobile-changes.outputs.mobile == 'true'
      run: |
        mkdir -p "$HOME/.android"
        keytool -genkey -v \
          -keystore "$HOME/.android/release.keystore" \
          -storepass android \
          -alias econoflow \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=EconoFlow,O=EconoFlow,C=PT"

    - name: Build standalone release APK
      if: steps.mobile-changes.outputs.mobile == 'true'
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="$HOME/.android/release.keystore" \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=econoflow \
          -Pandroid.injected.signing.key.password=android \
          --no-daemon
      working-directory: ./econoflow-mobile/android
      env:
        EXPO_PUBLIC_API_URL: https://econoflow.pt
        # The Sentry DSN is a public ingest endpoint, not a secret — it is
        # intentionally baked into the JS bundle by Metro at build time.
        EXPO_PUBLIC_SENTRY_DSN: https://e3e5bdde0b6e300e13e77f760e0c1cdf@o4511512006754304.ingest.de.sentry.io/4511512010096720
        # Auth token for uploading source maps so Sentry shows real file/line
        # numbers in crash reports. Add SENTRY_AUTH_TOKEN as a GitHub secret:
        # repo Settings → Secrets → Actions → New repository secret
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Upload release APK
      if: steps.mobile-changes.outputs.mobile == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: android-release-apk
        path: ./econoflow-mobile/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
