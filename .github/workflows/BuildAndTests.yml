# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: MR build and tests

on:
  pull_request:
    branches: [ "master" ]

concurrency:
  group: mr-build-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  checks: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'

    - name: Detect frontend changes in PR
      id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          client:
            - 'easyfinance.client/src/**'
          version_files:
            - 'easyfinance.client/src/assets/version.json'
            - 'easyfinance.client/src/app/core/utils/loaders/translate-http-loader.ts'

    - name: Auto bump frontend version for PR changes
      if: >
        steps.changes.outputs.client == 'true' &&
        steps.changes.outputs.version_files != 'true' &&
        github.actor != 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      run: |
        VERSION_FILE="easyfinance.client/src/assets/version.json"

        CURRENT_VERSION=$(node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(v.versionNumber);" "$VERSION_FILE")

        BASE_VERSION=$(git show origin/${{ github.base_ref }}:"${VERSION_FILE}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).versionNumber));")
        if [ "$CURRENT_VERSION" != "$BASE_VERSION" ]; then
          echo "Version already bumped to $CURRENT_VERSION (base: $BASE_VERSION). Skipping."
          exit 0
        fi

        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
        NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

        node -e "
          const fs = require('fs');
          const versionFile = process.argv[1];
          const nextVersion = process.argv[2];
          const json = JSON.parse(fs.readFileSync(versionFile, 'utf8'));
          json.versionNumber = nextVersion;
          fs.writeFileSync(versionFile, JSON.stringify(json, null, 2) + '\n');
        " "$VERSION_FILE" "$NEXT_VERSION"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "$VERSION_FILE"

        if git diff --cached --quiet; then
          echo "Version files already up to date."
          exit 0
        fi

        git commit -m "chore(ci): bump frontend version to ${NEXT_VERSION}"
        git push origin "HEAD:${{ github.head_ref }}"

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # nuget.config maps every package id to exactly one feed, so the private Gitea
    # feed is never asked for public packages it cannot own (those lookups 403 and
    # are retried, slowing every restore). This guards that mapping before the
    # restore below pays for a broken one.
    - name: Validate NuGet package source mapping
      run: pwsh -NoProfile -File scripts/nuget-source-mapping.test.ps1

    # TreatWarningsAsErrors turns NuGet audit findings into build errors, including
    # for transitive packages that no project references directly. This checks that
    # every known transitive advisory is still pinned at or above its first patched
    # release, before the restore below fails on it.
    - name: Validate NuGet vulnerability pinning
      run: pwsh -NoProfile -File scripts/nuget-vulnerability-pinning.test.ps1

    - name: Cache node_modules
      id: cache-node-modules-build
      uses: actions/cache@v6
      with:
        path: ./easyfinance.client/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('./easyfinance.client/package-lock.json') }}
            
    - name: Cache Cypress binary
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('./easyfinance.client/package-lock.json') }}

    - name: Restore dependencies
      run: dotnet restore EasyFinance.Server/EasyFinance.Server.csproj
      env:
        GITEA_NUGET_USERNAME: ${{ secrets.GITEA_NUGET_USERNAME }}
        GITEA_NUGET_TOKEN: ${{ secrets.GITEA_NUGET_TOKEN }}

    - name: Check code formatting
      run: dotnet format EasyFinance.Server/EasyFinance.Server.csproj --verify-no-changes --no-restore

    # Restrict the scan to nuget.org. Without --source the command runs its own restore
    # and asks the private Gitea feed for the registration metadata of every public
    # package id; Gitea answers 403 and the scan fails before reporting anything.
    # <packageSourceMapping> does not govern this lookup. The audit database NuGet
    # consults is nuget.org's and a private-feed id carries no advisory, so no coverage
    # is lost. scripts/nuget-vulnerability-pinning.test.ps1 enforces --source.
    - name: Check for vulnerable NuGet packages
      run: dotnet list EasyFinance.Server/EasyFinance.Server.csproj package --vulnerable --include-transitive --source https://api.nuget.org/v3/index.json --no-restore
      env:
        GITEA_NUGET_USERNAME: ${{ secrets.GITEA_NUGET_USERNAME }}
        GITEA_NUGET_TOKEN: ${{ secrets.GITEA_NUGET_TOKEN }}

    - name: Build backend application
      run: dotnet build EasyFinance.Server/EasyFinance.Server.csproj --configuration Debug --no-restore

    - name: Restore test projects
      run: |
        dotnet restore EasyFinance.Domain.Tests/EasyFinance.Domain.Tests.csproj
        dotnet restore EasyFinance.Application.Tests/EasyFinance.Application.Tests.csproj
        dotnet restore EasyFinance.Server.Tests/EasyFinance.Server.Tests.csproj
      env:
        GITEA_NUGET_USERNAME: ${{ secrets.GITEA_NUGET_USERNAME }}
        GITEA_NUGET_TOKEN: ${{ secrets.GITEA_NUGET_TOKEN }}

    - name: Build test projects
      run: |
        dotnet build EasyFinance.Domain.Tests/EasyFinance.Domain.Tests.csproj --configuration Debug --no-restore
        dotnet build EasyFinance.Application.Tests/EasyFinance.Application.Tests.csproj --configuration Debug --no-restore
        dotnet build EasyFinance.Server.Tests/EasyFinance.Server.Tests.csproj --configuration Debug --no-restore

    - name: Upload backend build outputs
      uses: actions/upload-artifact@v7
      with:
        name: backend-build-debug
        path: |
          EasyFinance*/bin/Debug/**
          EasyFinance*/obj/**
        retention-days: 1

    - name: Install dependencies
      if: steps.cache-node-modules-build.outputs.cache-hit != 'true'
      run: npm install
      working-directory: ./easyfinance.client

  unit-tests:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
    
    - name: Cache node_modules
      id: cache-node-modules-unit
      uses: actions/cache@v6
      with:
        path: ./easyfinance.client/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('./easyfinance.client/package-lock.json') }}

    - name: Install dependencies
      if: steps.cache-node-modules-unit.outputs.cache-hit != 'true'
      run: npm install
      working-directory: ./easyfinance.client

    - name: Download backend build outputs
      uses: actions/download-artifact@v8
      with:
        name: backend-build-debug
        path: .

    - name: Run .Net tests
      run: |
        dotnet test EasyFinance.Domain.Tests/EasyFinance.Domain.Tests.csproj --configuration Debug --no-build --no-restore --verbosity normal --logger trx --collect:"XPlat Code Coverage"
        dotnet test EasyFinance.Application.Tests/EasyFinance.Application.Tests.csproj --configuration Debug --no-build --no-restore --verbosity normal --logger trx --collect:"XPlat Code Coverage"
        dotnet test EasyFinance.Server.Tests/EasyFinance.Server.Tests.csproj --configuration Debug --no-build --no-restore --verbosity normal --logger trx --collect:"XPlat Code Coverage"

    - name: Check code coverage threshold
      if: always()
      shell: bash
      run: |
        COVERAGE_FILE=$(find . -name "coverage.cobertura.xml" -type f | head -1)
        if [ -z "$COVERAGE_FILE" ]; then
          echo "::warning::No coverage.cobertura.xml file found â€” skipping threshold check"
          exit 0
        fi
        LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
        COVERAGE=$(echo "$LINE_RATE * 100 / 1" | bc)
        THRESHOLD=80
        if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
          echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        fi
        echo "::notice::Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: ${{ github.workspace }}/**/TestResults/**/*
        retention-days: 5

    - name: Publish Test Summary
      uses: dorny/test-reporter@v3
      continue-on-error: true
      if: always()
      with:
        name: Test Results
        path: "${{ github.workspace }}/**/*.trx"
        reporter: dotnet-trx
        fail-on-error: false

    - name: Run Angular tests
      id: angular
      run: npm test -- --watch=false --browsers=ChromeHeadlessCI
      working-directory: ./easyfinance.client

    - name: Run Angular lint
      if: always()
      run: npm run lint
      working-directory: ./easyfinance.client

    - name: Run npm audit
      if: always()
      run: node ../scripts/audit-gate.mjs .
      working-directory: ./easyfinance.client

  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Detect mobile changes in PR
      id: mobile-changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          mobile:
            - 'econoflow-mobile/src/**'
            - 'econoflow-mobile/App.tsx'
            - 'econoflow-mobile/package.json'
            - 'econoflow-mobile/package-lock.json'
            - 'econoflow-mobile/tsconfig.json'
            - 'econoflow-mobile/.eslintrc.js'
            - 'scripts/audit-gate.mjs'
            - 'docs/security-exceptions.md'

    - name: Install Node.js
      if: steps.mobile-changes.outputs.mobile == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'

    - name: Cache mobile node_modules
      if: steps.mobile-changes.outputs.mobile == 'true'
      uses: actions/cache@v6
      with:
        path: ./econoflow-mobile/node_modules
        key: mobile-node-modules-${{ runner.os }}-${{ hashFiles('./econoflow-mobile/package-lock.json') }}

    - name: Install mobile dependencies
      if: steps.mobile-changes.outputs.mobile == 'true'
      run: npm ci
      working-directory: ./econoflow-mobile

    - name: TypeScript check
      if: steps.mobile-changes.outputs.mobile == 'true'
      run: npm run typecheck
      working-directory: ./econoflow-mobile

    - name: Lint
      if: steps.mobile-changes.outputs.mobile == 'true'
      run: npm run lint
      working-directory: ./econoflow-mobile

    - name: Run mobile unit tests
      if: steps.mobile-changes.outputs.mobile == 'true'
      run: npm test
      working-directory: ./econoflow-mobile

    - name: Run mobile dependency audit gate
      if: steps.mobile-changes.outputs.mobile == 'true'
      run: node ../scripts/audit-gate.mjs .
      working-directory: ./econoflow-mobile

  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'

    # These tests guard the repository's own policy artefacts (the CRA disclosure
    # channel, the Article 14 runbook and the SBOM pipeline) plus the npm audit
    # allow-list. They run in seconds and need no dependencies installed.
    - name: Run repository policy tests
      run: node --test "scripts/*.test.mjs"

    # Every `overrides` pin must sit on the latest published release. A stale pin is how
    # a later advisory silently re-opens on a dependency that was already "fixed" once.
    # Needs registry.npmjs.org; the fix is always to upgrade the pin, never to allow-list.
    - name: Verify override pins are on the latest release
      run: node scripts/npm-override-freshness.test.mjs

    - name: Verify the SBOM generator runs
      run: node scripts/generate-sbom.mjs --skip-nuget --output sbom-smoke

  integration-tests:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # PostgreSQL is the only database the application has, so the end-to-end suite runs
    # against it rather than the in-memory store. Without this the job exercised a store
    # that is never deployed — and could not see a PostgreSQL-only regression, because
    # the in-memory fixtures carry different dates than the ones the specs reason about.
    #
    # The image is pinned to the digest production runs, not to a minor tag: a suite that
    # passes on 16 says nothing about the engine that is deployed on 18, and `16-alpine`
    # would silently track a moving tag. Move this digest only together with production.
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: econoflow
          POSTGRES_PASSWORD: econoflow
          POSTGRES_DB: econoflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
    
    - name: Cache node_modules
      id: cache-node-modules-integration
      uses: actions/cache@v6
      with:
        path: ./easyfinance.client/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('./easyfinance.client/package-lock.json') }}

    - name: Cache Cypress binary
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('./easyfinance.client/package-lock.json') }}

    - name: Install dependencies
      if: steps.cache-node-modules-integration.outputs.cache-hit != 'true'
      run: npm install
      working-directory: ./easyfinance.client

    - name: Download backend build outputs
      uses: actions/download-artifact@v8
      with:
        name: backend-build-debug
        path: .

    - name: Restore apphost execute permission
      shell: bash
      run: |
        find ./EasyFinance.Server/bin/Debug -type f -name EasyFinance.Server -exec chmod +x {} \;

    - name: Generate dev certificate
      run: dotnet dev-certs https

    - name: Start application
      id: dotnet
      run: dotnet run --project ./EasyFinance.Server --configuration Debug --no-build --no-restore -p:IncludeSpaProject=true --urls https://localhost:7003/ &
      env:
        EconoFlow_SECRET_KEY_FOR_DELETE_TOKEN: ci-integration-test-placeholder-secret-key-32chars
        # Point the application at the PostgreSQL service above. A Host= connection
        # string is what makes Development ask for PostgreSQL instead of falling back
        # to the in-memory store.
        EasyFinanceDB: Host=localhost;Port=5432;Database=econoflow;Username=econoflow;Password=econoflow
        # The fixtures are skipped for a real database by design, but every spec signs
        # in as the seeded test@test.com, so this run asks for them explicitly.
        EconoFlow_SEED_DEVELOPMENT_DATA: "true"

    - name: Wait for servers to be ready
      run: |
        timeout 300 bash -c 'until curl -sf http://localhost:4200 > /dev/null 2>&1; do sleep 3; done'
      shell: bash

    - name: Run Cypress tests
      id: cypress
      run: npx cypress run
      working-directory: ./easyfinance.client

    - name: Archive Cypress errors
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: cypress-screenshots
        path: ./easyfinance.client/cypress/screenshots
        retention-days: 5
