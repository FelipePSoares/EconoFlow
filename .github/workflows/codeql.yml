name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '41 19 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup Node
      if: matrix.language == 'csharp'
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'

    - name: Cache node_modules
      if: matrix.language == 'csharp'
      uses: actions/cache@v6
      with:
        path: ./easyfinance.client/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('./easyfinance.client/package-lock.json') }}

    - name: Cache Cypress binary
      if: matrix.language == 'csharp'
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('./easyfinance.client/package-lock.json') }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # The C# build writes EasyFinance.Server/bin/Release/net10.0/web.config, the IIS
        # boilerplate the SDK copies into every publish output. CodeQL was analysing that
        # generated copy and raising cs/web/missing-x-frame-options against it, at a path
        # that cannot be fixed in source (bin/ is gitignored) and that is regenerated
        # from the real web.config, which does now set the header. Scan source only.
        config: |
          paths-ignore:
            - '**/bin/**'
            - '**/obj/**'
            - '**/node_modules/**'

    # The root nuget.config maps each package id to a single feed (see its
    # <packageSourceMapping> comment): public packages must never be looked for on the
    # private Gitea feed, and private ids must stay off nuget.org. This fails the run if
    # that mapping regresses.
    - name: Validate NuGet package source mapping
      if: matrix.language == 'csharp'
      run: pwsh -NoProfile -File scripts/nuget-source-mapping.test.ps1

    # Transitive advisories must stay pinned at or above their first patched release,
    # or the restore below fails on NuGet audit warnings treated as errors.
    - name: Validate NuGet vulnerability pinning
      if: matrix.language == 'csharp'
      run: pwsh -NoProfile -File scripts/nuget-vulnerability-pinning.test.ps1

    - name: Restore
      if: matrix.language == 'csharp'
      run: dotnet restore EasyFinance.Server/EasyFinance.Server.csproj
      env:
        GITEA_NUGET_USERNAME: ${{ secrets.GITEA_NUGET_USERNAME }}
        GITEA_NUGET_TOKEN: ${{ secrets.GITEA_NUGET_TOKEN }}

    - name: Build
      if: matrix.language == 'csharp'
      run: dotnet build EasyFinance.Server/EasyFinance.Server.csproj --configuration Release --no-restore

    - name: Install frontend dependencies
      if: matrix.language == 'csharp'
      run: npm install
      working-directory: ./easyfinance.client

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
