version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: "npm"
    directory: "/easyfinance.client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
      ngx-translate:
        patterns:
          - "@ngx-translate/*"
      types:
        patterns:
          - "@types/*"
      testing:
        patterns:
          - "jasmine*"
          - "karma*"
      # Everything not claimed by the groups above lands in one weekly PR instead of one PR per
      # package, so a routine refresh can be reviewed and merged in a single pass.
      angular-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/econoflow-mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react-native:
        patterns:
          - "react-native"
          - "@react-native/*"
      react-navigation:
        patterns:
          - "@react-navigation/*"
      sentry:
        patterns:
          - "@sentry/*"
      react:
        patterns:
          - "react"
          - "@types/react"
      types:
        patterns:
          - "@types/*"
      # Keep the Expo native modules on the SDK 57 versions of `bundledNativeModules.json`;
      # minor/patch bumps of everything else arrive together in one PR.
      mobile-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
      extensions:
        patterns:
          - "Microsoft.Extensions.*"
      entity-framework-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      test-tools:
        patterns:
          - "coverlet*"
          - "FluentAssertions"
          - "Moq"
          - "xunit*"
          - "Shouldly"
      dotnet-tools:
        patterns:
          - "dotnet-ef"
      dotnet-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
